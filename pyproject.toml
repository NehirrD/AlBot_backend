[project]
name = "albot"
version = "0.1.0"
description = "AlBot backend"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt[crypto] (>=2.15.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "openai (>=2,<3)",
    "instructor (>=1.17.0,<2.0.0)",
    "pydantic (>=2.14.2,<3.0.0)",
]

[project.scripts]
dev = "scripts:dev"

[tool.poetry]
packages = [{ include = "scripts.py", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
